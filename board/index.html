<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Albert+Sans:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--purple:#6D58A4;--purple-deep:#4A3880;--teal:#0D878F;--algae:#92E2C1;--lavender:#F5F0FE;--ink:#2B2233;--muted:#6B6477}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Albert Sans',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--purple-deep),var(--teal));min-height:100vh}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:24px;padding:40px 34px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(43,34,51,.25);text-align:center}
.card .script{font-family:'Caveat',cursive;font-size:25px;color:var(--teal);display:block;margin-bottom:6px}
.card h1{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:800;margin-bottom:8px}
.card p{font-size:14.5px;color:var(--muted);margin-bottom:20px;line-height:1.55}
.card input{width:100%;border:1.5px solid #E5E0F0;border-radius:12px;padding:13px 15px;font:inherit;font-size:16px;margin-bottom:12px}
.card input:focus{outline:none;border-color:var(--purple)}
.card button{width:100%;background:var(--algae);color:#0B4A36;border:none;border-radius:100px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.card button:disabled{opacity:.6;cursor:default}
.err{color:#B4434E;font-size:13.5px;margin-top:10px;min-height:18px}
#viewer{display:none;position:fixed;inset:0;background:#fff;z-index:10}
#viewer iframe{width:100%;height:100%;border:0}
.lock{font-size:34px;margin-bottom:10px}
</style>
</head>

<div class="gate" id="gate">

    <h1>Momni 2.0 — Board Brief</h1>
    <p>This page is private. Enter the passphrase Karmel shared with you to read the brief.</p>
    <form id="f">
      <input type="password" id="pw" placeholder="Passphrase" autocomplete="off" autofocus>
      <button type="submit" id="go">Unlock the brief</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</div>

  var f=document.getElementById('f'), err=document.getElementById('err'), go=document.getElementById('go');
  f.addEventListener('submit', function(e){
    e.preventDefault(); err.textContent=''; go.disabled=true;
    var pw=document.getElementById('pw').value;
    var enc=new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(DATA));
    }).then(function(buf){
      var html=new TextDecoder().decode(buf);
      document.getElementById('frame').srcdoc=html;
      document.getElementById('gate').style.display='none';
      document.getElementById('viewer').style.display='block';
    }).catch(function(){
      go.disabled=false; err.textContent='That passphrase didn’t unlock the brief. Try again.';
    });
  });
})();
</script>
</body>
</html>
