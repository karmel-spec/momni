# Momni — marketing site (momni.com)
# Publish this folder as-is; no build step needed.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pretty URLs: /find-care/right-now/ etc. already resolve to index.html files.
# Redirect bare /waitlist to the form.
[[redirects]]
  from = "/join"
  to = "/waitlist/"
  status = 301
