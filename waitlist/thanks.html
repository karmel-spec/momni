<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in the Circle | Momni</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Albert+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--purple:#6D58A4;--teal:#0D878F;--lavender:#F5F0FE;--ink:#2B2233;--muted:#6B6477}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Albert Sans',sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--lavender),#fff 400px);text-align:center;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:80px 24px}
img{width:120px;height:auto;margin-bottom:24px}
h1{font-family:'Montserrat',sans-serif;font-size:36px;font-weight:800;margin-bottom:8px}
.script{font-family:'Caveat',cursive;font-size:30px;color:var(--teal);display:block;margin-bottom:16px}
p{font-size:17px;color:var(--muted);margin-bottom:24px}
a.btn{display:inline-block;background:var(--purple);color:white;font-weight:600;padding:13px 30px;border-radius:100px;text-decoration:none}
</style>

<!-- SEO -->
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://momni.com/waitlist/thanks.html">
<meta property="og:title" content="You&#x27;re in the Circle | Momni">
<meta property="og:description" content="You&#x27;re on the Momni waitlist. Welcome to the Circle — we&#x27;ll be in touch soon, mama.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://momni.com/waitlist/thanks.html">
<meta property="og:image" content="https://momni.com/assets/photos/mama-lifting-toddler-sky.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="You&#x27;re in the Circle | Momni">
<meta name="twitter:description" content="You&#x27;re on the Momni waitlist. Welcome to the Circle — we&#x27;ll be in touch soon, mama.">
<meta name="twitter:image" content="https://momni.com/assets/photos/mama-lifting-toddler-sky.jpg">
</head>
<body>
<div class="wrap">
  <img src="../assets/momni-icon-color.png" alt="The Momni elephant">
  <h1>You're in the Circle, mama.</h1>
  <span class="script">Welcome home.</span>
  <p>Watch your inbox for the relaunch letter — and the day your neighborhood lights up, you'll be the first to know.</p>
    <div id="next-steps" style="text-align:left;max-width:420px;margin:8px auto 0"></div>
  <a class="btn" href="../index.html">Back to Momni</a>
</div>
<script>
try{var i=JSON.parse(localStorage.getItem('momniInterests')||'{}');var out='';
function card(t,b){return '<div style="background:white;border:1.5px solid #E5E0F0;border-radius:14px;padding:14px 18px;margin:10px 0;font-size:15px;text-align:left"><strong>'+t+'</strong><br>'+b+'</div>';}
if(i.volunteer)out+=card('You raised your hand to volunteer 💜','Next step: see the roles and how to start on the <a href="../volunteer/index.html" style="color:#0D878F;font-weight:600">volunteer page</a> — Karmel personally reads every hand raised.');
if(i.start_circle)out+=card('You want to start a Circle','Beautiful. Read <a href="../circles/index.html" style="color:#0D878F;font-weight:600">how Circles work</a> — your Leader Kit comes with your welcome email.');
if(i.join_circle&&!i.start_circle)out+=card('You want to join a Circle','See the Circles already forming on the <a href="../circles/index.html" style="color:#0D878F;font-weight:600">Circles page</a>.');
if(i.support)out+=card('You want to support the vision','The mission lives at the <a href="https://momnifoundation.org" style="color:#0D878F;font-weight:600">Momni Foundation</a> — and the <a href="../shop/index.html" style="color:#0D878F;font-weight:600">Momni Shop</a> opens its shelves soon.');
document.getElementById('next-steps').innerHTML=out;}catch(e){}
</script>

<!-- momni-lang-picker -->
<style>.goog-te-banner-frame,.skiptranslate{display:none!important}body{top:0!important}
#momni-lang{border:1.5px solid #E5E0F0;border-radius:100px;padding:6px 12px;font:inherit;font-size:14px;color:inherit;background:#fff;cursor:pointer}</style>
<div id="google_translate_element" style="display:none"></div>
<script>
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'en',autoDisplay:false},'google_translate_element')}
(function(){
  var sel=document.getElementById('momni-lang');
  if(!sel)return;
  var m=document.cookie.match(/(?:^|;\s*)googtrans=\/en\/([^;]+)/);
  if(m)sel.value=decodeURIComponent(m[1]);
  sel.addEventListener('change',function(){
    var code=sel.value,host=location.hostname;
    if(code==='en'){
      document.cookie='googtrans=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
      document.cookie='googtrans=;path=/;domain='+host+';expires=Thu, 01 Jan 1970 00:00:00 GMT';
      document.cookie='googtrans=;path=/;domain=.'+host+';expires=Thu, 01 Jan 1970 00:00:00 GMT';
    }else{
      document.cookie='googtrans=/en/'+code+';path=/';
      document.cookie='googtrans=/en/'+code+';path=/;domain='+host;
      document.cookie='googtrans=/en/'+code+';path=/;domain=.'+host;
    }
    location.reload();
  });
})();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
