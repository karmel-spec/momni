<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in the Circle | Momni</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Albert+Sans:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--purple:#6D58A4;--teal:#0D878F;--lavender:#F5F0FE;--ink:#2B2233;--muted:#6B6477}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Albert Sans',sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--lavender),#fff 400px);text-align:center;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:80px 24px}
img{width:120px;height:auto;margin-bottom:24px}
h1{font-family:'Montserrat',sans-serif;font-size:36px;font-weight:800;margin-bottom:8px}
.script{font-family:'Caveat',cursive;font-size:30px;color:var(--teal);display:block;margin-bottom:16px}
p{font-size:17px;color:var(--muted);margin-bottom:24px}
a{display:inline-block;background:var(--purple);color:white;font-weight:600;padding:13px 30px;border-radius:100px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <img src="../assets/momni-icon-color.png" alt="The Momni elephant">
  <h1>You're in the Circle, mama.</h1>
  <span class="script">Welcome home.</span>
  <p>Watch your inbox for the relaunch letter — and the day your neighborhood lights up, you'll be the first to know.</p>
  <a href="../index.html">Back to Momni</a>
</div>
</body>
</html>
